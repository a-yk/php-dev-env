services:
  php-cli-84:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/cli/php8.4.Dockerfile
    container_name: php8.4-cli
    tty: true
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ./php/configs/php8.4.ini:/usr/local/etc/php/php.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

