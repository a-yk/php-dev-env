services:
  php-cli-84:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/cli/php8.4.Dockerfile
    container_name: php8.4-cli
    tty: true
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ./php/configs/php8.4.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - app-network

  php-cli-80:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/cli/php8.0.Dockerfile
    container_name: php8.0-cli
    tty: true
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ./php/configs/php8.0.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - app-network

  php-cli-74:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/cli/php7.4.Dockerfile
    container_name: php7.4-cli
    tty: true
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ./php/configs/php7.4.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - app-network

  php-fpm-84:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/fpm/php8.4.Dockerfile
    container_name: php8.4-fpm
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ../data/log/php:/var/log/php:rw
      - ./php/configs/php8.4.ini:/usr/local/etc/php/php.ini:ro
      - ./php/configs/php8.4-fpm.ini:/usr/local/etc/php-fpm.conf:ro
    networks:
      - app-network

  php-fpm-80:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/fpm/php8.0.Dockerfile
    container_name: php8.0-fpm
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ../data/log/php:/var/log/php:rw
      - ./php/configs/php8.0.ini:/usr/local/etc/php/php.ini:ro
      - ./php/configs/php8.0-fpm.ini:/usr/local/etc/php-fpm.conf:ro
    networks:
      - app-network

  php-fpm-74:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./php/fpm/php7.4.Dockerfile
    container_name: php7.4-fpm
    working_dir: /var/www/html
    volumes:
      - ../public_html:/var/www/html:rw
      - ../data/log/php:/var/log/php:rw
      - ./php/configs/php7.4.ini:/usr/local/etc/php/php.ini:ro
      - ./php/configs/php7.4-fpm.ini:/usr/local/etc/php-fpm.conf:ro
    networks:
      - app-network

  httpd:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./httpd/httpd.Dockerfile
    container_name: httpd
    volumes:
      - ../public_html:/var/www/html
      - ./httpd/configs/php-fcgi:/usr/local/apache2/conf/extra/php:ro
      - ./httpd/configs/vhosts:/usr/local/apache2/conf/extra/vhosts:ro
      - ./httpd/configs/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ../data/log/httpd:/var/log/httpd:rw
    ports:
      - "80:80"
    networks:
      - app-network
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: fktrctqr
    ports:
      - "3306:3306"
    volumes:
      - ../data/db/mysql:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_CONTROLHOST: mysql
      PMA_CONTROLPORT: 3306
      PMA_PMADB: phpmyadmin
      PMA_CONTROLUSER: pma
      PMA_CONTROLPASS: pma
    ports:
      - "8080:80"
    networks:
      - app-network

  #kafka
  controller-1:
    image: apache/kafka-native:latest
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network

  controller-2:
    image: apache/kafka-native:latest
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network

  controller-3:
    image: apache/kafka-native:latest
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network

  broker-1:
    image: apache/kafka-native:latest
    container_name: broker-1
    volumes:
      - ../data/kafka/broker-1:/tmp/kafka-logs:rw
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - app-network

  broker-2:
    image: apache/kafka-native:latest
    container_name: broker-2
    volumes:
      - ../data/kafka/broker-2:/tmp/kafka-logs:rw
    ports:
      - 39092:9092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - app-network

  broker-3:
    image: apache/kafka-native:latest
    container_name: broker-3
    volumes:
      - ../data/kafka/broker-3:/tmp/kafka-logs:rw
    ports:
      - 49092:9092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

