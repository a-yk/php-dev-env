  httpd:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
      dockerfile: ./httpd/httpd.Dockerfile
    container_name: httpd
    volumes:
      - ../public_html:/var/www/html
      - ./httpd/configs/php-fcgi:/usr/local/apache2/conf/extra/php:ro
      - ./httpd/configs/vhosts:/usr/local/apache2/conf/extra/vhosts:ro
      - ./httpd/configs/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ../data/log/httpd:/var/log/httpd:rw
    ports:
      - "80:80"
    networks:
      - app-network
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: fktrctqr
    ports:
      - "3306:3306"
    volumes:
      - ../data/db/mysql:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_CONTROLHOST: mysql
      PMA_CONTROLPORT: 3306
      PMA_PMADB: phpmyadmin
      PMA_CONTROLUSER: pma
      PMA_CONTROLPASS: pma
    ports:
      - "8080:80"
    networks:
      - app-network

  #kafka
  #sudo sysctl fs.inotify.max_user_instances=512
  #sudo sysctl fs.inotify.max_user_watches=524288
  controller1:
    image: apache/kafka-native:latest
    container_name: controller1
    volumes:
      - ../data/kafka/controller1:/tmp/kafka-logs:rw
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "2afc7a9b-d35f-4877-9c7f-10b831aa5f13"
    networks:
      - app-network

  controller2:
    image: apache/kafka-native:latest
    container_name: controller2
    volumes:
      - ../data/kafka/controller2:/tmp/kafka-logs:rw
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "2afc7a9b-d35f-4877-9c7f-10b831aa5f13"
    networks:
      - app-network

  controller3:
    image: apache/kafka-native:latest
    container_name: controller3
    volumes:
      - ../data/kafka/controller3:/tmp/kafka-logs:rw
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "2afc7a9b-d35f-4877-9c7f-10b831aa5f13"
    networks:
      - app-network

  broker1:
    image: apache/kafka-native:latest
    container_name: broker1
    volumes:
      - ../data/kafka/broker1:/tmp/kafka-logs:rw
    ports:
      - 19092:19092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker1:9092,PLAINTEXT_HOST://localhost:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "2afc7a9b-d35f-4877-9c7f-10b831aa5f13"
    depends_on:
      - controller1
      - controller2
      - controller3
    networks:
      - app-network

  broker2:
    image: apache/kafka-native:latest
    container_name: broker2
    volumes:
      - ../data/kafka/broker2:/tmp/kafka-logs:rw
    ports:
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker2:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "2afc7a9b-d35f-4877-9c7f-10b831aa5f13"
    depends_on:
      - controller1
      - controller2
      - controller3
    networks:
      - app-network

  broker3:
    image: apache/kafka-native:latest
    container_name: broker3
    volumes:
      - ../data/kafka/broker3:/tmp/kafka-logs:rw
    ports:
      - 39092:39092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:39092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker3:9092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      CLUSTER_ID: "2afc7a9b-d35f-4877-9c7f-10b831aa5f13"
    depends_on:
      - controller1
      - controller2
      - controller3
    networks:
      - app-network

  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 9080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker1:9092,broker2:9092,broker3:9092"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "PLAINTEXT"

    depends_on:
      - controller1
      - controller2
      - controller3
      - broker1
      - broker2
      - broker3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

