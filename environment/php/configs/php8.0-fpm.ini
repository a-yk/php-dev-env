[global]
error_log = /var/log/php/php8.0-fpm-error.log
log_limit = 8192
daemonize = no

[www]
user = app
group = app

access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
listen = 9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
;pm.status_path = /status
;ping.path = /ping
