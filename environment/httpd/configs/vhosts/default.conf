<VirtualHost *:*>
    ServerName localhost

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog /var/log/httpd/default-error.log
    CustomLog /var/log/httpd/default-access.log combined

    <Directory /var/www/html>
        Include conf/extra/php/php7.4.conf
    </Directory>
</VirtualHost>

<VirtualHost *:*>
    ServerName cl-helper.vhost

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/cl-helper/public

    ErrorLog /var/log/httpd/cl-helper-error.log
    CustomLog /var/log/httpd/cl-helper-access.log combined

    <Directory /var/www/html>
        Include conf/extra/php/php8.4.conf
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
